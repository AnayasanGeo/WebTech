<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form action="">
        <table>
            <tr>
                <td>
                    <label for="Enter Full Name"><b>Full Name:</b></label>
                </td>
                <td>
                    <input type="text" name="Full Name"
                    required
                    minlength="2"
                    maxlength="30"
                    placeholder="First Name, Last Name">
                </td>
            </tr>
    <tr>
        <td>
        <label for="Student ID"><b>Student ID:</b></label>
        </td>
        <td>
            <input type="number" name="Studen_Id_number"
                required
                minlength="8"
                maxlength="10"
                placeholder="12-3456-789">
        </td>
    </tr>

    <tr>
        <td>
            <label for="Email"><b>Email:</b></label>
        </td>
        <td>
            <input type="email" name="email"
            required
            placeholder="abc1234@students.uc-bcf.edu.ph"
            >
        </td>
    </tr>
    <tr>
        <td>
            <label for="Password"><b>Password:</b></label>
        </td>
        <td>
            <input type="password" name="password"
            required
            minlength="8"
            maxlength="16"
            placeholder="minimum of 8 and maximum of 16 characters"
            >
        </td>
    </tr>
    <tr>
        <td>
            <label for="Birthday"><b>Birthday: </b></label>
        </td>
        <td>
            <input type="date" name="Birthdate"
            required
            placeholder="02-02-1999"
            >
        </td>
    </tr>
    <tr>
        <td>
            <label for="Gender"><b>Gender: </b></label>
        </td>
        <td>
            <input  type="radio" id="Male"name="Gender">
            <label for="Male">Male</label>
            <input  type="radio" id="Female"name="Gender">
            <label for="Female">Female</label>
        </td>
    </tr> 
    <tr>
        <td>
            <label for="program"><b>Program: </b></label>
        </td>
        <td>
            <select name="Program" id="Program">
                <option value="BSIT">Bachelor of Science in Information Technology</option>
                <option value="BSCS">Bachelor of Science in Computer Science</option>
                <option value="BSDA">Bachelor of Science in Data Analytics</option>
                <option value="BSAI">Bachelor of Science in Artificial Intelligence</option>
                <option value="BSCpE">Bachelor of Science in Computer Engineering</option>
            </select>
        </td>
    </tr>
    <tr>
        <td>
            <label for="Hobbies"><b>Hobbies: </b></label>
        </td>
        <td>
            <textarea name="Hobbies id="Hobbies></textarea>
        </td>
    </tr>
    <tr>
        <td>
            <label for="Comments"><b>Comments: </b></label>
        </td>
        <td>
            <textarea name="" id=""></textarea>
        </td>
    </tr>
    <tr>
        <td>
            <button>Submit</button>
        </td>
        <td>
            <button> Reset</button>
        </td>
    </tr>
        </table>
    </form>
</body>
</html>
