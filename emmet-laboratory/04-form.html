<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="text" id="text">
    <input type="email" name="email" id="email">
    <input type="password" name="password" id="password">
    <input type="checkbox" name="checkbox id="checkbox>
    <input type="radio" name="radio" id="radio">
    <input type="submit" value="">
    <!-- Form Challenge -->
    <form action="">
        <h3>Student Registration Form</h3>
<table>
    <tr>
        <td>
            <label for="Student ID">Student ID</label>
        </td>
        <td>
            <input type="text" name="" id="" placeholder="12-3456-789">
        </td>
    </tr>
    <tr>
        <td>
            <label for="Full Name">Full Name</label>
        </td>
        <td>
            <input type="text" name="Full Name" id="Full Name" placeholder="First Name, Last Name">
        </td>
    </tr>
    <tr>
        <td>
            <label for="Email">Email</label>
        </td>
        <td>
            <input type="email" name="Email" id="Email" placeholder="abc1234@gmail.com">
        </td>
    </tr>
    <tr>
        <td>
            <label for="Gender">Gender</label>
        </td>
        <td>
           <input type="radio" name="Male" id="Gender">Male
           <input type="radio" name="Female" id="Gender">Female
        </td>
    </tr>
    <tr>
        <td>
            <label for="Course">Course</label>
        </td>
        <td>
            <select name="Course" id="course">
                <option value="BSIT">Bachelor of Science in Information Technology</option>
                <option value="BSCS">Bachelor of Science in Computer Science</option>
                <option value="BSDA">Bachelor of Science in Data Analytics</option>
                <option value="BSAI">Bachelor of Science in Artificial Intelligence</option>
                <option value="BSCpE">Bachelor of Science in Computer Engineering</option>
            </select>
        </td>
    </tr>
    <tr>
        <td>
            <label for="Hobbies">Hobbies</label>
        </td>
        <td>
            <textarea name="Hobbies id="Hobbies"></textarea>
        </td>
    </tr>
    <tr>
        <td>
            <label for="Address">Address</label>
        </td>
        <td>
            <input type="text" name="Address" id="Address" placeholder="Gov. pack, Baguio City">
        </td>
    </tr>
    <tr>
        <td><button>Submit</button></td>
    </tr>
</table>
    </form>
</body>
</html>
