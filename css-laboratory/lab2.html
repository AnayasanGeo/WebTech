<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratory 2: CSS Selectors — Element, Class, and ID</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 id="page-tittle">This is Heading!</h1>
    <p class="text-content">paragraph 1</p>
    <p>paragraph 2</p>
    <p>paragraph 3</p>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>

    <!-- Reflection

      .card is a class selector designed for reusable styles across multiple
      elements, while #page-title is an ID selector meant for a single,
      unique element on a page.
    </p> -->
  </body>
</html>
